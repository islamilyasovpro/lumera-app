<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lumera">
<title>Lumera</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* CSS complet ici */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

:root {
  --gold: #E4AD12;
  --gold-soft: rgba(228,173,18,.22);
  --bg: #070707;
  --bg2: #101010;
  --bg3: #171717;
  --card: #121214;
  --card2: #161619;
  --text: #F4F1EA;
  --text2: #A8A197;
  --muted: #756F66;
  --border: rgba(228,173,18,.18);
  --border2: rgba(255,255,255,.08);
  --red: #E84A4F;
  --green: #7ED33C;
  --w: #E8242A;
  --z: #00C8E0;
  --r: 14px;
  --ff: 'DM Sans', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  --ff2: 'Bebas Neue', sans-serif;
}

html, body {
  height: 100%;
  width: 100%;
  overflow: hidden;
  background: var(--bg);
  font-family: var(--ff);
  color: var(--text);
}

body {
  background: #000;
}

/* Screen styles */
.screen {
  position: fixed;
  inset: 0;
  background: transparent;
  opacity: 0;
  pointer-events: none;
  transition: opacity .18s ease;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
}

.screen.active {
  opacity: 1;
  pointer-events: all;
  z-index: 10;
}

/* Loading screen */
#screen-loading {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  padding: 24px;
}

.spinner {
  width: 30px;
  height: 30px;
  border: 3px solid rgba(228,173,18,.18);
  border-top-color: var(--gold);
  border-radius: 50%;
  animation: spin .8s linear infinite;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

/* Login screen */
#screen-login {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px;
}

.login-form {
  width: 100%;
  max-width: 330px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.input {
  width: 100%;
  background: #111113;
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 14px 16px;
  color: var(--text);
  font-family: var(--ff);
  font-size: 15px;
  outline: none;
}

.input:focus {
  border-color: rgba(228,173,18,.55);
  box-shadow: 0 0 0 3px rgba(228,173,18,.08);
}

.input::placeholder {
  color: var(--text2);
}

.input[readonly] {
  opacity: .7;
}

.btn-primary {
  background: linear-gradient(180deg,#F4C424 0%,var(--gold) 100%);
  border: none;
  border-radius: 14px;
  padding: 14px 16px;
  color: #060606;
  font-family: var(--ff);
  font-size: 15px;
  font-weight: 800;
  cursor: pointer;
  width: 100%;
}

.btn-primary:disabled {
  opacity: .5;
  cursor: default;
}

.error-text {
  color: var(--red);
  font-size: 13px;
  text-align: center;
  min-height: 18px;
}

.remember-row {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  color: var(--text2);
  cursor: pointer;
}

.remember-row input {
  width: 17px;
  height: 17px;
  accent-color: var(--gold);
}

/* App screen */
#screen-app {
  display: flex;
  flex-direction: column;
}

/* Top bar */
.topbar {
  flex-shrink: 0;
  background: rgba(12,12,13,.96);
  border-bottom: 1px solid rgba(228,173,18,.16);
  padding: calc(env(safe-area-inset-top,0px) + 8px) 14px 8px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 20;
  backdrop-filter: blur(14px);
}

.topbar img {
  height: 38px !important;
  width: auto !important;
  max-width: 126px;
  object-fit: contain;
}

.topbar-right {
  display: flex;
  align-items: center;
  gap: 8px;
}

.admin-badge {
  background: transparent;
  border: 1px solid rgba(228,173,18,.65);
  color: var(--gold);
  font-size: 10px;
  font-weight: 800;
  padding: 4px 9px;
  border-radius: 999px;
  letter-spacing: .04em;
}

#el-username {
  font-size: 13px !important;
  color: var(--text) !important;
  max-width: 82px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.sync-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--green);
}

.sync-dot.busy {
  background: var(--gold);
  animation: pulse 1s infinite;
}

.sync-dot.error {
  background: var(--red);
}

@keyframes pulse {
  0%,100%{opacity:1}
  50%{opacity:.3}
}

.avatar {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: linear-gradient(180deg,#F4C424 0%,var(--gold) 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 15px;
  font-weight: 900;
  color: #050505;
  cursor: pointer;
}

/* Pages container */
.pages {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  padding: 18px 14px calc(76px + env(safe-area-inset-bottom,0px));
}

/* Bottom navigation */
.bottomnav {
  flex-shrink: 0;
  background: rgba(13,13,14,.98);
  border-top: 1px solid rgba(228,173,18,.16);
  display: flex;
  position: sticky;
  bottom: 0;
  z-index: 20;
  padding: 4px 6px calc(4px + env(safe-area-inset-bottom,0px));
  backdrop-filter: blur(14px);
}

.nav-btn {
  flex: 1;
  min-height: 54px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  padding: 6px 2px;
  cursor: pointer;
  border: none;
  background: transparent;
  color: var(--text2);
  font-family: var(--ff);
  font-size: 10px;
  position: relative;
  border-radius: 12px;
}

.nav-btn.active {
  color: var(--gold);
  background: rgba(228,173,18,.08);
}

.nav-btn svg {
  width: 21px;
  height: 21px;
  fill: currentColor;
}

.badge-dot {
  position: absolute;
  top: 7px;
  right: calc(50% - 13px);
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--red);
  border: 2px solid var(--bg2);
  display: none;
}

.badge-dot.show {
  display: block;
}

/* Page styles */
.page {
  display: none;
}

.page.active {
  display: block;
}

.page-title {
  font-family: var(--ff2);
  font-size: 2rem;
  line-height: 1;
  letter-spacing: .12em;
  margin-bottom: 8px;
  color: var(--text);
}

.gold-bar {
  width: 48px;
  height: 3px;
  background: var(--gold);
  border-radius: 999px;
  margin-bottom: 16px;
}

.section-label {
  font-size: 12px;
  color: var(--text2);
  letter-spacing: .12em;
  text-transform: uppercase;
  margin-bottom: 10px;
  font-weight: 800;
}

/* Stats cards */
.stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 16px;
}

.stat-card {
  background: linear-gradient(180deg,#141416 0%,#101012 100%);
  border: 1px solid var(--border2);
  border-radius: 16px;
  padding: 12px;
  min-height: 112px;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  position: relative;
  overflow: hidden;
}

.stat-label {
  font-size: 10px;
  color: var(--text2);
  letter-spacing: .10em;
  text-transform: uppercase;
  margin-bottom: 5px;
  font-weight: 700;
}

.stat-value {
  font-family: var(--ff2);
  font-size: 2rem;
  line-height: .9;
  color: var(--gold);
}

.stat-unit {
  font-size: 12px;
  color: var(--text2);
  margin-top: 6px;
}

#page-dashboard .btn-primary[data-action="new-intervention"] {
  height: 52px;
  border-radius: 16px;
  margin-bottom: 18px !important;
  font-size: 15px;
  gap: 8px !important;
}

/* Card styles */
.card {
  background: linear-gradient(135deg, #1a1a1a 0%, #121212 100%);
  border: 1px solid rgba(228, 173, 18, 0.2);
  border-radius: 16px;
  padding: 16px;
  margin-bottom: 12px;
  box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
  transition: all 0.3s ease;
}

.card:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
}

.card-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}

.card-left {
  flex: 1;
  min-width: 0;
}

.card-right {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 4px;
  flex-shrink: 0;
}

.card-name {
  font-weight: 800;
  font-size: 16px;
  color: #F4F1EA;
  margin-bottom: 4px;
}

.card-sub {
  font-size: 13px;
  color: #A8A197;
  line-height: 1.4;
}

.card-price {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.5rem;
  color: #E4AD12;
  font-weight: 800;
}

.card-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  font-size: 12px;
  color: #A8A197;
  align-items: center;
}

.creator {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 11px;
  color: #A8A197;
  margin-top: 4px;
}

.creator-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  flex-shrink: 0;
}

/* Badges */
.badge {
  font-size: 11px;
  padding: 5px 10px;
  border-radius: 20px;
  font-weight: 700;
  display: inline-block;
}

.badge-pending {
  background: rgba(255, 255, 255, 0.1);
  color: #A8A197;
  border: 1px solid rgba(255, 255, 255, 0.2);
}

.badge-started {
  background: rgba(228, 173, 18, 0.15);
  color: #E4AD12;
  border: 1px solid rgba(228, 173, 18, 0.3);
}

.badge-done {
  background: rgba(126, 211, 60, 0.15);
  color: #7ED33C;
  border: 1px solid rgba(126, 211, 60, 0.3);
}

/* Actions */
.actions {
  display: flex;
  gap: 8px;
  margin-top: 10px;
  flex-wrap: wrap;
}

.btn {
  flex: 1;
  min-width: 80px;
  padding: 9px 10px;
  border-radius: 12px;
  cursor: pointer;
  font-family: var(--ff);
  font-size: 12px;
  font-weight: 700;
  border: 1px solid;
  text-align: center;
  white-space: nowrap;
}

.btn:disabled {
  opacity: .4;
  cursor: default;
}

.btn-gold {
  background: var(--gold);
  border-color: var(--gold);
  color: #060606;
}

.btn-green {
  background: rgba(126,211,60,.11);
  border-color: rgba(126,211,60,.28);
  color: var(--green);
}

.btn-red {
  background: rgba(232,74,79,.10);
  border-color: rgba(232,74,79,.28);
  color: var(--red);
}

.btn-ghost, .btn-outline {
  background: #171717;
  border-color: var(--border2);
  color: var(--text2);
}

.btn-blue {
  background: rgba(0,120,255,.12);
  border-color: rgba(0,120,255,.3);
  color: #4da3ff;
}

/* Chrono badge */
.chrono-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 11px;
  font-weight: 700;
  background: rgba(228,173,18,.1);
  border: 1px solid var(--gold-soft);
  color: var(--gold);
  padding: 3px 8px;
  border-radius: 999px;
}

.chrono-badge.running {
  background: rgba(126,211,60,.1);
  border-color: rgba(126,211,60,.28);
  color: var(--green);
  animation: pulse 1.5s infinite;
}

  width: 6px;
  height:
